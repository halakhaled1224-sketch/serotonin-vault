<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Checklist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 5px;
    }

    p {
      text-align: center;
      color: gray;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 20px;
      color: #444;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    .task {
      display: flex;
      align-items: center;
      margin: 10px 0;
      font-size: 16px;
      padding: 8px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .task:hover {
      background: #f5f5f5;
    }

    input {
      margin-right: 10px;
      transform: scale(1.2);
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 14px;
      color: gray;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>📚 Study Checklist</h1>
    <p>Organize your study like a pro 💪</p>

    <h2>📖 Lectures</h2>
    <div class="task"><input type="checkbox"> Watch lecture videos</div>
    <div class="task"><input type="checkbox"> Read lecture notes</div>
    <div class="task"><input type="checkbox"> Highlight important points</div>

    <h2>✍️ Practice</h2>
    <div class="task"><input type="checkbox"> Solve past questions</div>
    <div class="task"><input type="checkbox"> Review mistakes</div>

    <h2>🧠 Revision</h2>
    <div class="task"><input type="checkbox"> Summarize topics</div>
    <div class="task"><input type="checkbox"> Quick revision before exam</div>

    <div class="footer">
      Good luck 🚀 You’ve got this!
    </div>

  </div>

</body>
</html>
